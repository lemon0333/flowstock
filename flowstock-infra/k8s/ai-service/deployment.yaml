apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: flowstock
  labels:
    app: ai-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      # Bun JIT(JavaScriptCore)가 컨테이너 default 보안에서 작동 못 함:
      #  - seccomp가 mmap PROT_EXEC 차단
      #  - capabilities 부족으로 GC thread suspend 실패 ("embedder failed to suspend thread")
      # 개인 mini PC 단일 노드라 privileged: true 로 한 번에 풀음. 호스트(권한 풀린 상태)에서
      # 같은 binary 정상 동작했던 사실에 부합.
      securityContext:
        seccompProfile:
          type: Unconfined
      # 호스트의 claude credential + binary를 컨테이너에 mount.
      # 인증도 호스트 ~/.claude.json 사용해 한 군데서 관리.
      volumes:
        - name: claude-config
          hostPath:
            path: /home/lemon/.claude.json
            type: File
        - name: claude-dir
          hostPath:
            path: /home/lemon/.claude
            type: Directory
        - name: claude-cli
          hostPath:
            path: /usr/lib/node_modules/@anthropic-ai/claude-code
            type: Directory
      containers:
        - name: ai-service
          image: ghcr.io/lemon0333/flowstock-ai:latest
          securityContext:
            privileged: true
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: claude-config
              mountPath: /root/.claude.json
              readOnly: false
            - name: claude-dir
              mountPath: /root/.claude
              readOnly: false
            - name: claude-cli
              mountPath: /usr/lib/node_modules/@anthropic-ai/claude-code
              readOnly: true
          env:
            - name: LOG_LEVEL
              value: "INFO"
            - name: MYSQL_HOST
              value: "mysql.flowstock.svc.cluster.local"
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USER
              value: "flowstock"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flowstock-secrets
                  key: MYSQL_PASSWORD
            - name: MYSQL_DATABASE
              value: "flowstock_ai"
            - name: HOME
              value: "/root"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              # Bun JIT가 호스트 RAM(1.07GB)을 보고 큰 mmap 시도 — cgroup limit
              # 1Gi에서 막혀 segfault. 4Gi로 여유 확보.
              memory: "4Gi"
              cpu: "2000m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: flowstock
spec:
  selector:
    app: ai-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
