apiVersion: v1
kind: Secret
metadata:
  name: flowstock-secrets
  namespace: flowstock
type: Opaque
stringData:
  DB_PASSWORD: "${DB_PASSWORD}"
  REDIS_PASSWORD: "${REDIS_PASSWORD}"
  JWT_SECRET: "${JWT_SECRET}"
  # CLAUDE_API_KEY: 더 이상 API 키 불필요 - Claude Code SDK 사용 (claude login)
  KIS_APP_KEY: "${KIS_APP_KEY}"
  KIS_APP_SECRET: "${KIS_APP_SECRET}"
  DART_API_KEY: "${DART_API_KEY}"
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
  GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
  NAVER_CLIENT_ID: "${NAVER_CLIENT_ID}"
  NAVER_CLIENT_SECRET: "${NAVER_CLIENT_SECRET}"
  MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
  MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
  # Umami: 같은 PostgreSQL 인스턴스의 별도 DB(umami) 사용
  UMAMI_DATABASE_URL: "postgresql://flowstock:${DB_PASSWORD}@postgresql.flowstock.svc.cluster.local:5432/umami"
  UMAMI_APP_SECRET: "${UMAMI_APP_SECRET}"
  # Airflow — 메타DB는 airflow-postgres StatefulSet에 격리 (운영 Postgres와 분리)
  AIRFLOW_POSTGRES_PASSWORD: "${AIRFLOW_POSTGRES_PASSWORD}"
  AIRFLOW_SQL_ALCHEMY_CONN: "postgresql+psycopg2://airflow:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres.flowstock.svc.cluster.local:5432/airflow"
  AIRFLOW_FERNET_KEY: "${AIRFLOW_FERNET_KEY}"          # `python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"`
  AIRFLOW_WEBSERVER_SECRET_KEY: "${AIRFLOW_WEBSERVER_SECRET_KEY}"  # `openssl rand -hex 32`
  AIRFLOW_ADMIN_PASSWORD: "${AIRFLOW_ADMIN_PASSWORD}"  # webserver 첫 admin 로그인용
