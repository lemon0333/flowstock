apiVersion: apps/v1
kind: Deployment
metadata:
  name: flowstock-backend
  namespace: flowstock
  labels:
    app: flowstock-backend
spec:
  # mini PC 단일 노드 환경에선 replica 다수 운영해도 노드 다운 시 전체 다운이라 의미 없음.
  # CPU 8% / 메모리 50% 수준 트래픽이면 1 replica로 충분.
  # 노드 추가 후 다시 늘리려면 HPA min/maxReplicas 변경.
  replicas: 1
  selector:
    matchLabels:
      app: flowstock-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1               # 새 pod 1개 더 띄운 후 옛 pod 종료 (Recreate 대신)
      maxUnavailable: 0         # 짧은 ready 갭만 허용
  template:
    metadata:
      labels:
        app: flowstock-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: flowstock-backend
          image: ghcr.io/lemon0333/flowstock-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: DB_HOST
              value: "postgresql.flowstock.svc.cluster.local"
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: "flowstock"
            - name: DB_USERNAME
              value: "flowstock"
            - name: REDIS_HOST
              value: "redis.flowstock.svc.cluster.local"
            - name: REDIS_PORT
              value: "6379"
            # Secrets
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flowstock-secrets
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flowstock-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: flowstock-secrets
                  key: JWT_SECRET
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: flowstock-secrets
                  key: GOOGLE_CLIENT_ID
            - name: NAVER_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: flowstock-secrets
                  key: NAVER_CLIENT_ID
            - name: NAVER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: flowstock-secrets
                  key: NAVER_CLIENT_SECRET
            - name: KIS_APP_KEY
              valueFrom:
                secretKeyRef:
                  name: flowstock-secrets
                  key: KIS_APP_KEY
            - name: KIS_APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: flowstock-secrets
                  key: KIS_APP_SECRET
            - name: DART_API_KEY
              valueFrom:
                secretKeyRef:
                  name: flowstock-secrets
                  key: DART_API_KEY
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: flowstock-secrets
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: flowstock-secrets
                  key: AWS_SECRET_ACCESS_KEY
            - name: AI_SERVICE_URL
              value: "http://ai-service.flowstock.svc.cluster.local:8000"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          # Spring Boot 부팅 ~90s + readiness 감지 latency 단축
          # startup: 5s × 60 = 5분까지 부팅 대기 (이전 10s × 30 = 5분과 동일하지만 ready 감지 2배 빠름)
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: flowstock-backend
  namespace: flowstock
spec:
  selector:
    app: flowstock-backend
  ports:
    - port: 80
      targetPort: 8080
---
# HPA — mini PC 1대 환경에선 사실상 비활성. CPU 80% 넘으면 max 2까지만 (피크 시).
# 노드 추가 후엔 maxReplicas 늘리면 됨.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flowstock-backend-hpa
  namespace: flowstock
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flowstock-backend
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 85
