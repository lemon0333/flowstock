# Airflow 메타데이터 전용 PostgreSQL.
#
# 기존 flowstock postgresql과 분리한 이유:
#  1) Airflow는 매 task 인스턴스마다 작성이 많음 — 운영 PG에 부담 분리
#  2) 메타 스키마 30+ 테이블 — 운영 DB 네임스페이스 오염 방지
#  3) 장애 격리 — airflow 죽어도 backend DB 영향 0
#
# k3s local-path PVC 10Gi. 메타데이터만 저장하므로 충분.
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-postgres-config
  namespace: flowstock
data:
  POSTGRES_DB: airflow
  POSTGRES_USER: airflow
  PGDATA: /var/lib/postgresql/data/pgdata
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: airflow-postgres-pvc
  namespace: flowstock
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: local-path
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: airflow-postgres
  namespace: flowstock
spec:
  serviceName: airflow-postgres
  replicas: 1
  selector:
    matchLabels:
      app: airflow-postgres
  template:
    metadata:
      labels:
        app: airflow-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: airflow-postgres-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: flowstock-secrets
                  key: AIRFLOW_POSTGRES_PASSWORD
          volumeMounts:
            - name: storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "airflow"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "airflow"]
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: airflow-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-postgres
  namespace: flowstock
spec:
  selector:
    app: airflow-postgres
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None  # headless — StatefulSet stable DNS
