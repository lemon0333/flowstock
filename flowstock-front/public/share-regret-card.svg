<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F1B2E"/>
      <stop offset="55%" stop-color="#3B1D3A"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB7185"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="rgba(251,113,133,0)"/>
      <stop offset="100%" stop-color="rgba(251,113,133,0.35)"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 놓친 상승 차트 (장식) -->
  <polygon points="0,560 180,520 340,540 500,430 660,460 820,340 980,360 1200,200 1200,630 0,630"
           fill="url(#up)"/>
  <polyline points="0,560 180,520 340,540 500,430 660,460 820,340 980,360 1200,200"
            fill="none" stroke="#FB7185" stroke-width="5" stroke-linejoin="round"/>
  <!-- '그때 샀어야 했던' 지점 마커 -->
  <circle cx="820" cy="340" r="12" fill="#FDE68A"/>
  <text x="820" y="302" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif"
        font-size="26" font-weight="700" fill="#FDE68A">이때 샀어야 했는데</text>

  <!-- 로고 박스 -->
  <rect x="92" y="96" width="96" height="96" rx="24" fill="url(#logo)"/>
  <polyline points="112,166 138,142 152,151 170,124"
            fill="none" stroke="white" stroke-width="9"
            stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="158,124 170,124 170,136"
            fill="none" stroke="white" stroke-width="9"
            stroke-linecap="round" stroke-linejoin="round"/>
  <text x="212" y="162" font-family="-apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif"
        font-size="46" font-weight="800" fill="white">FlowStock</text>

  <!-- 메인 카피 -->
  <text x="92" y="300" font-family="-apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif"
        font-size="72" font-weight="800" fill="white">내가 얼마나</text>
  <text x="92" y="386" font-family="-apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif"
        font-size="72" font-weight="800" fill="#FB7185">못 벌었을까?</text>

  <text x="92" y="452" font-family="-apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif"
        font-size="30" font-weight="500" fill="rgba(255,255,255,0.85)">종목과 날짜만 넣으면 놓친 수익을 바로 계산해요</text>

  <!-- 뱃지 -->
  <rect x="92" y="500" width="286" height="56" rx="28" fill="rgba(255,255,255,0.12)"/>
  <text x="235" y="537" text-anchor="middle" font-family="-apple-system, 'Apple SD Gothic Neo', system-ui, sans-serif"
        font-size="26" font-weight="700" fill="white">1초 후회 시뮬레이터</text>
</svg>
