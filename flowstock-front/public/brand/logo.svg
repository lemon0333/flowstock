<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- FlowStock service logo (140x140 정방형, OAuth consent용) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- 둥근 사각 배경 -->
  <rect width="140" height="140" rx="30" ry="30" fill="url(#bg)"/>

  <!-- 차트 라인 (상승 추세) -->
  <path d="M 24 96 L 48 78 L 72 88 L 96 56 L 116 36"
        stroke="white" stroke-width="5" fill="none"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#shadow)"/>
  <!-- 마지막 포인트 강조 -->
  <circle cx="116" cy="36" r="6" fill="white" filter="url(#shadow)"/>
  <circle cx="116" cy="36" r="3" fill="#3B82F6"/>

  <!-- 워드마크 'FS' -->
  <text x="70" y="124"
        font-family="-apple-system, BlinkMacSystemFont, 'Pretendard Variable', system-ui, sans-serif"
        font-size="20" font-weight="800"
        fill="white" text-anchor="middle"
        letter-spacing="3">FlowStock</text>
</svg>
