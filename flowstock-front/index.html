<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 페이지별 title/description은 react-helmet-async(SEO 컴포넌트)가 라우트마다 덮어씀.
         아래 메타는 fallback (JS 미실행 환경 / 첫 페인트 전 봇 크롤링 대비) -->
    <title>FlowStock — 당신의 전략은 실전에서 통할까요? 여기서 먼저 검증하세요</title>
    <meta name="description" content="당신의 전략은 실전에서 통할까요? 여기서 먼저 검증하세요. 45개 학습 토픽 + 가상 1,000만원 모의투자 + AI 복기 분석 — 주린이를 키우는 한국 주식 학습 사이트." />
    <meta name="keywords" content="주린이, 주식 입문, 주식 처음, 주식 공부, 주식 초보, 주식 학습, 주린이 사이트, 주식 용어, 모의투자, 백테스트, 코스피, 코스닥, KOSPI, KOSDAQ" />
    <meta name="author" content="FlowStock" />
    <meta name="theme-color" content="#3B82F6" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="canonical" href="https://flowstock.info/" />

    <!-- Preconnect — 첫 화면에서 곧바로 호출하는 backend / analytics 도메인 TLS handshake 미리 -->
    <link rel="preconnect" href="https://api.flowstock.info" crossorigin />
    <link rel="dns-prefetch" href="https://api.flowstock.info" />
    <link rel="preconnect" href="https://analytics.flowstock.info" crossorigin />
    <link rel="dns-prefetch" href="https://analytics.flowstock.info" />

    <!-- Open Graph (fallback) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FlowStock" />
    <meta property="og:title" content="FlowStock — 주린이를 키우는 한국 주식 학습 사이트" />
    <meta property="og:description" content="주식 1도 모르는 주린이부터 단계적으로 성장. 45개 학습 토픽, 가상 모의투자, 실시간 시세." />
    <meta property="og:url" content="https://flowstock.info/" />
    <meta property="og:image" content="https://flowstock.info/og-image.svg" />
    <meta property="og:locale" content="ko_KR" />

    <!-- Twitter (fallback) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FlowStock — 주린이를 키우는 한국 주식 학습 사이트" />
    <meta name="twitter:description" content="주식 1도 모르는 주린이부터 단계적으로 성장. 45개 학습 토픽, 가상 모의투자, 실시간 시세." />
    <meta name="twitter:image" content="https://flowstock.info/og-image.svg" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
