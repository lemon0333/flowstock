name: Feedback Triage

# 매일 09:30 KST(00:30 UTC)에 /api/feedback의 신규 항목을 GitHub Issue 로 자동 변환.
# - keyword heuristic 분류 (bug/ui-fix/feature/triage) → 라벨 부착
# - fb#NN 식별자로 중복 방지
# - Anthropic API 비용 0원
#
# NOTE: bash heredoc 안 inline python 금지 (yaml indent 충돌). 스크립트는 .github/scripts/feedback_triage.py.

on:
  schedule:
    - cron: '30 0 * * *' # 매일 09:30 KST
  workflow_dispatch:

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run feedback triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BACKEND_URL: https://api.flowstock.info
        run: python .github/scripts/feedback_triage.py
