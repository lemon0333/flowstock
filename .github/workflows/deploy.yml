name: Deploy FlowStock

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/lemon0333/flowstock-backend
  AI_IMAGE: ghcr.io/lemon0333/flowstock-ai

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('flowstock-backend/**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Test (JUnit5)
        working-directory: flowstock-backend
        run: chmod +x gradlew && ./gradlew :app:test --no-daemon

      - name: Build with Gradle
        working-directory: flowstock-backend
        run: ./gradlew :app:bootJar --no-daemon

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: flowstock-backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

  build-ai:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: flowstock-ai
          push: true
          tags: |
            ${{ env.AI_IMAGE }}:latest
            ${{ env.AI_IMAGE }}:${{ github.sha }}

  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: flowstock-front/package-lock.json

      - name: Install dependencies
        working-directory: flowstock-front
        run: npm ci

      - name: Build
        working-directory: flowstock-front
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          VITE_NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          VITE_NAVER_CALLBACK_URL: https://flowstock.info/login
          VITE_API_URL: https://api.flowstock.info/api
        run: npm run build

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages project create flowstock-front \
            --production-branch=main || echo "(project already exists, continuing)"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 커밋 메시지의 한글/특수기호로 wrangler API가 UTF-8 invalid 에러를 내는 경우가 있어
          # ASCII로 안전하게 sanitize (영숫자, 공백, 일부 punctuation만 통과)
          COMMIT_HASH=$(git rev-parse --short HEAD)
          COMMIT_MSG_RAW=$(git log -1 --pretty=%s)
          COMMIT_MSG_SAFE=$(printf '%s' "$COMMIT_MSG_RAW" | LC_ALL=C tr -cd '[:alnum:][:space:]_.,:;()/-' | head -c 200)
          if [ -z "$COMMIT_MSG_SAFE" ]; then
            COMMIT_MSG_SAFE="deploy $COMMIT_HASH"
          fi
          echo "Using commit message: $COMMIT_MSG_SAFE"
          npx --yes wrangler@latest pages deploy flowstock-front/dist \
            --project-name=flowstock-front \
            --branch=main \
            --commit-hash="$COMMIT_HASH" \
            --commit-message="$COMMIT_MSG_SAFE"

  deploy-k8s:
    runs-on: ubuntu-latest
    needs: [build-backend, build-ai]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tailscale connect
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Tailscale diagnostics
        run: |
          echo "=== tailscale status ==="
          tailscale status || echo "(tailscale status failed)"
          echo
          echo "=== reaching mini PC (TCP 22) ==="
          timeout 10 bash -c "</dev/tcp/${{ secrets.MINI_PC_HOST }}/22" \
            && echo "[OK] TCP 22 reachable" \
            || echo "[FAIL] cannot reach mini PC on port 22"
          echo
          echo "=== ping mini PC ==="
          ping -c 3 -W 2 ${{ secrets.MINI_PC_HOST }} || echo "(ping failed — could be ICMP blocked, not necessarily fatal)"

      - name: Add mini PC to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.MINI_PC_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to k3s via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.MINI_PC_HOST }}
          username: lemon
          key: ${{ secrets.MINI_PC_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            export KUBECONFIG=$HOME/.kube/config

            # ── 단계별 timing 측정 (병목 식별용) ──
            T_START=$(date +%s)
            log_step() { echo "[$(date '+%H:%M:%S')] +$(($(date +%s)-T_START))s — $1"; }

            log_step "checkout main"
            cd /opt/flowstock
            git fetch origin main
            git reset --hard origin/main
            cd flowstock-infra

            log_step "1) namespace + secrets"
            k3s kubectl apply -f k8s/namespace/namespaces.yaml
            bash scripts/generate-secrets.sh

            log_step "2) DBs (idempotent)"
            k3s kubectl apply -f k8s/postgresql/postgresql.yaml
            k3s kubectl apply -f k8s/mysql/mysql.yaml
            k3s kubectl apply -f k8s/redis/redis.yaml

            log_step "3) cloudflared envsubst"
            set -a; source .env; set +a
            CLOUDFLARED_BEFORE=$(k3s kubectl get configmap cloudflared-config -n flowstock -o jsonpath='{.data.config\.yml}' 2>/dev/null | sha256sum | cut -d' ' -f1)
            envsubst < k8s/cloudflared/cloudflared.yaml | k3s kubectl apply -f -
            CLOUDFLARED_AFTER=$(k3s kubectl get configmap cloudflared-config -n flowstock -o jsonpath='{.data.config\.yml}' 2>/dev/null | sha256sum | cut -d' ' -f1)
            if [ "$CLOUDFLARED_BEFORE" != "$CLOUDFLARED_AFTER" ]; then
              echo "Cloudflared config changed — rollout restart"
              k3s kubectl rollout restart deployment/cloudflared -n flowstock
            fi

            log_step "4) observability stack"
            k3s kubectl apply -f k8s/monitoring/kube-state-metrics.yaml || true
            k3s kubectl apply -f k8s/monitoring/node-exporter.yaml || true
            k3s kubectl apply -f k8s/monitoring/prometheus.yaml || true
            k3s kubectl apply -f k8s/monitoring/grafana.yaml || true
            k3s kubectl apply -f k8s/jaeger/jaeger.yaml || true

            log_step "5) ai + backend manifests"
            k3s kubectl apply -f k8s/ai-service/deployment.yaml
            k3s kubectl apply -f k8s/backend/deployment.yaml

            BACKEND_REF="${{ env.BACKEND_IMAGE }}:${{ github.sha }}"
            AI_REF="${{ env.AI_IMAGE }}:${{ github.sha }}"
            # NOTE: k3s ctr image pull은 root 권한 필요 — mini PC는 비밀번호 sudo 막혀있어서 skip.
            # rolling update 내부의 imagePull로 의존 (GHCR 평균 30-60s, 1회만).

            log_step "7) set image (rolling update 시작)"
            k3s kubectl set image deployment/flowstock-backend \
              flowstock-backend=$BACKEND_REF \
              -n flowstock
            k3s kubectl set image deployment/ai-service \
              ai-service=$AI_REF \
              -n flowstock

            log_step "8) rollout status (backend + ai 병렬 대기, 각 8분)"
            k3s kubectl rollout status deployment/flowstock-backend -n flowstock --timeout=480s &
            ROLL_BACKEND=$!
            k3s kubectl rollout status deployment/ai-service -n flowstock --timeout=480s &
            ROLL_AI=$!

            FAIL=0
            if ! wait $ROLL_BACKEND; then
              echo "❌ backend rollout 실패"
              k3s kubectl describe pods -n flowstock -l app=flowstock-backend | tail -40
              FAIL=1
            fi
            if ! wait $ROLL_AI; then
              echo "❌ ai-service rollout 실패"
              k3s kubectl describe pods -n flowstock -l app=ai-service | tail -40
              FAIL=1
            fi

            log_step "9) final pod status"
            k3s kubectl get pods -n flowstock

            log_step "TOTAL"
            exit $FAIL
