name: Daily Health Check

# 매일 오전 9시 KST(00:00 UTC)에 CI 실패 / 의존성 보안 / 운영 URL probe 점검.
# 결과는 워크플로 로그 + GitHub Issue 로 보고. Anthropic API 비용 0원, GitHub Actions 만 사용.
#
# NOTE: bash heredoc 안에 inline python 두지 말 것 — yaml multi-line scalar
#       indent rule 과 충돌해 syntax error (이전 #6 run 에서 학습). 모두 jq 로 처리.

on:
  schedule:
    - cron: '0 0 * * *' # 매일 09:00 KST
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recent CI failures (last 24h)
        id: ci
        run: |
          set -e
          NOW=$(date -u +%s)
          CUTOFF=$((NOW - 86400))
          FAILS=$(curl -s "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=20" \
            | jq -r --argjson cutoff "$CUTOFF" '
              [
                .workflow_runs[]
                | select(.conclusion == "failure")
                | select((.updated_at // .created_at | fromdateiso8601) >= $cutoff)
                | "- \(.head_sha[0:7]) \(.display_title[0:60]) (\(.html_url))"
              ]
              | if length == 0 then "NONE" else join("\n") end
            ')
          echo "fails<<EOF" >> $GITHUB_OUTPUT
          printf '%s\n' "$FAILS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "최근 24시간 CI 실패:"
          echo "$FAILS"

      - name: Synthetic URL probes (production)
        id: probes
        run: |
          set -u
          # (URL, expected_status, must_contain_in_body)
          declare -a CHECKS=(
            "https://flowstock.info/|200|FlowStock"
            "https://flowstock.info/sitemap.xml|200|<urlset"
            "https://flowstock.info/robots.txt|200|Sitemap:"
            "https://api.flowstock.info/actuator/health|200|UP"
            "https://api.flowstock.info/api/news?limit=1|200|"
            "https://api.flowstock.info/api/economy/dashboard|200|"
            "https://api.flowstock.info/api/dart/financials/005930|200|"
            "https://api.flowstock.info/api/sectors|200|"
            "https://api.flowstock.info/api/macro/dashboard|200|"
            "https://api.flowstock.info/api/articles|200|"
          )
          FAILS=""
          for entry in "${CHECKS[@]}"; do
            IFS='|' read -r url expected must <<< "$entry"
            BODY=$(mktemp)
            CODE=$(curl -sSL -o "$BODY" -w "%{http_code}" --max-time 10 \
              -A "Mozilla/5.0 (compatible; flowstock-healthcheck/1.0)" \
              "$url" || echo "000")
            REDIRECTS=$(curl -sIL --max-time 10 "$url" 2>/dev/null | grep -ic "^HTTP/" || echo "1")
            ERR=""
            if [ "$CODE" != "$expected" ]; then
              ERR="status=$CODE (expected $expected)"
            elif [ -n "$must" ] && ! grep -q -- "$must" "$BODY"; then
              ERR="missing required content: $must"
            elif [ "$REDIRECTS" -gt 3 ]; then
              ERR="too many redirects ($REDIRECTS hops)"
            fi
            if [ -n "$ERR" ]; then
              FAILS="${FAILS}- ${url} → ${ERR}\n"
              echo "FAIL: $url → $ERR"
            else
              echo "OK:   $url ($CODE)"
            fi
            rm -f "$BODY"
          done
          if [ -z "$FAILS" ]; then FAILS="CLEAN"; fi
          echo "probes<<EOF" >> $GITHUB_OUTPUT
          printf '%b' "$FAILS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: flowstock-front/package-lock.json

      - name: Frontend npm audit (high+critical only)
        id: npm_audit
        working-directory: flowstock-front
        run: |
          npm ci --no-audit --no-fund --silent
          AUDIT=$(npm audit --omit=dev --audit-level=high --json 2>/dev/null \
            | jq -r '
              (.metadata.vulnerabilities.high // 0) as $h
              | (.metadata.vulnerabilities.critical // 0) as $c
              | if ($h + $c) > 0 then
                  "\($c) critical, \($h) high\n" +
                  ([
                    .vulnerabilities | to_entries[]
                    | select(.value.severity == "high" or .value.severity == "critical")
                    | "- \(.key) (\(.value.severity))"
                  ] | .[0:10] | join("\n"))
                else "CLEAN" end
            ' || echo "ERROR (audit parse failed)")
          echo "audit<<EOF" >> $GITHUB_OUTPUT
          printf '%s\n' "$AUDIT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "npm audit:"
          echo "$AUDIT"

      - name: Compose report
        id: report
        run: |
          REPORT=$(cat <<EOF
          ## 📊 FlowStock Daily Health Report — $(date -u +%Y-%m-%d)

          ### 🔴 최근 24h CI 실패
          ${{ steps.ci.outputs.fails }}

          ### 🛡 Frontend npm audit (high/critical)
          ${{ steps.npm_audit.outputs.audit }}

          ### 🌐 Production URL probes
          ${{ steps.probes.outputs.probes }}

          ---
          _Generated by .github/workflows/daily-health.yml — ${{ github.run_id }}_
          EOF
          )
          echo "report<<EOF" >> $GITHUB_OUTPUT
          echo "$REPORT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "$REPORT"

      - name: Open or update tracking issue (only if there are findings)
        if: steps.ci.outputs.fails != 'NONE' || steps.npm_audit.outputs.audit != 'CLEAN' || steps.probes.outputs.probes != 'CLEAN'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0,10);
            const title = `Health Report — ${today}`;
            const body = `${{ steps.report.outputs.report }}`;
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'health-report',
              state: 'open',
              per_page: 5,
            });
            const existing = open.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['health-report'],
              });
            }
